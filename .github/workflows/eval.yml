name: RAG Evaluation & Smoke Test

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'ai-core/**'
      - '.github/workflows/eval.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ai-core/**'
  workflow_dispatch:

jobs:
  rag-smoke-test:
    name: RAG Quality Smoke Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./ai-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Knowledge Base
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ingest_data.py
          python ingest_sales_playbooks.py

      - name: Run CI Smoke Test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_PROVIDER: "gemini"
          EVAL_JUDGE_MODEL: "gemini-2.5-flash"
        run: |
          python run_eval_ci.py

      - name: Upload CI Evaluation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-report
          path: ai-core/reports/ci_smoke_report.json
          retention-days: 14
