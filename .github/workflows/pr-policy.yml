name: PR Policy (Danger)

on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  danger:
    name: 🚦 PR Policy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # Bắt buộc để Danger post comment
      issues: write          # Danger cần để tạo/update comment

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Danger
        run: npm install --no-save danger

      - name: Run Danger
        run: npx danger ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
