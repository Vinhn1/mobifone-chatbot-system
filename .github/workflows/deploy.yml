name: Deploy MobiFone Chatbot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 35m
          # Truyền tất cả secrets vào env của SSH session
          envs: DB_USERNAME,DB_PASSWORD,DB_DATABASE,DB_SYNCHRONIZE,JWT_SECRET,JWT_EXPIRES_IN,GEMINI_API_KEY,AI_PROVIDER,GEMINI_MODEL,OPENAI_API_KEY,EVAL_JUDGE_PROVIDER,EVAL_JUDGE_MODEL,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASS,SMTP_FROM,CORS_ALLOWED_ORIGINS,ADMIN_SEED_PASSWORD,SALES_SEED_PASSWORD,SUBSCRIBER_SEED_PASSWORD
          script: |
            set -e  # Dừng ngay nếu có lỗi
            export DEBIAN_FRONTEND=noninteractive

            DEPLOY_DIR="/opt/mobifone-chatbot-system"

            echo "=== [1/5] Cập nhật source code ==="
            # Clone nếu chưa có, nếu đã có thì fetch + reset --hard
            # Dùng reset --hard thay vì pull để tránh merge conflict với .env
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Thư mục chưa tồn tại, clone từ đầu..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            # Sao lưu cấu hình kênh truyền thông và token đã lưu trên Admin Portal (nếu có)
            if [ -f "ai-core/rag_config.json" ]; then
              cp ai-core/rag_config.json /tmp/rag_config.json.bak
            fi

            # Fetch code mới nhất và reset cứng — KHÔNG merge, tránh conflict
            git fetch origin main
            git reset --hard origin/main
            echo "✓ Code đã cập nhật lên: $(git log --oneline -1)"

            # Khôi phục & merge các token/kênh truyền thông từ bản backup vào rag_config.json mới
            if [ -f "/tmp/rag_config.json.bak" ]; then
              python3 -c "
import json, os
bak_path = '/tmp/rag_config.json.bak'
cur_path = 'ai-core/rag_config.json'
try:
    with open(bak_path, 'r', encoding='utf-8') as f:
        bak_data = json.load(f)
    with open(cur_path, 'r', encoding='utf-8') as f:
        cur_data = json.load(f)
    preserve_keys = [
        'fb_enabled', 'fb_verify_token', 'fb_page_token', 'fb_page_id',
        'zalo_enabled', 'zalo_app_id', 'zalo_secret_key', 'zalo_access_token',
        'zalo_refresh_token', 'zalo_oa_id'
    ]
    for k in preserve_keys:
        if k in bak_data:
            cur_data[k] = bak_data[k]
    with open(cur_path, 'w', encoding='utf-8') as f:
        json.dump(cur_data, f, ensure_ascii=False, indent=2)
    print('✓ Đã bảo lưu cấu hình Facebook/Zalo Token thành công!')
except Exception as e:
    print(f'⚠️ Không thể merge cấu hình cũ: {e}')
" || true
            fi

            echo "=== [2/5] Ghi file .env từ GitHub Secrets ==="
            # Ghi .env SAU khi git reset --hard (tránh bị git overwrite)
            printf '%s\n' \
              "DB_HOST=db" \
              "DB_PORT=5432" \
              "DB_USERNAME=${DB_USERNAME}" \
              "DB_PASSWORD=${DB_PASSWORD}" \
              "DB_DATABASE=${DB_DATABASE}" \
              "DB_SYNCHRONIZE=${DB_SYNCHRONIZE}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "JWT_EXPIRES_IN=${JWT_EXPIRES_IN}" \
              "GEMINI_API_KEY=${GEMINI_API_KEY}" \
              "AI_PROVIDER=${AI_PROVIDER}" \
              "GEMINI_MODEL=${GEMINI_MODEL}" \
              "OPENAI_API_KEY=${OPENAI_API_KEY}" \
              "EVAL_JUDGE_PROVIDER=${EVAL_JUDGE_PROVIDER}" \
              "EVAL_JUDGE_MODEL=${EVAL_JUDGE_MODEL}" \
              "SMTP_HOST=${SMTP_HOST}" \
              "SMTP_PORT=${SMTP_PORT}" \
              "SMTP_USER=${SMTP_USER}" \
              "SMTP_PASS=${SMTP_PASS}" \
              "SMTP_FROM=${SMTP_FROM}" \
              "CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}" \
              "ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}" \
              "SALES_SEED_PASSWORD=${SALES_SEED_PASSWORD}" \
              "SUBSCRIBER_SEED_PASSWORD=${SUBSCRIBER_SEED_PASSWORD}" \
              > .env
            echo "✓ File .env đã ghi ($(wc -l < .env) dòng)"

            echo "=== [3/5] Dừng và dọn container cũ ==="
            # Bước 1: Docker Compose down bình thường
            docker compose down --remove-orphans --timeout 30 || true

            # Bước 2: Force xóa TẤT CẢ container còn sót theo label project
            # (xử lý trường hợp build thủ công trước đó để lại container)
            STALE=$(docker ps -aq --filter "label=com.docker.compose.project=mobifone-chatbot-system" 2>/dev/null)
            if [ -n "$STALE" ]; then
              echo "Xóa container còn sót: $STALE"
              docker rm -f $STALE
            fi

            # Bước 3: Xóa network cũ nếu còn (tránh conflict "network already exists")
            docker network rm mobifone-chatbot-system_default 2>/dev/null || true

            # Bước 4: Xóa dangling images
            docker images --filter "dangling=true" -q | xargs -r docker rmi -f || true

            echo "✓ Containers và network đã dọn xong"
            sleep 3

            echo "=== [4/5] Build và khởi chạy ==="
            # --force-recreate: buộc tạo lại container kể cả khi image không đổi
            docker compose up -d --build --force-recreate --remove-orphans
            echo "✓ docker compose up hoàn tất"


            echo "=== [5/5] Kiểm tra trạng thái & Health Check ==="
            sleep 15
            docker compose ps

            # Kiểm tra có container nào bị Exit hoặc liên tục Restarting không
            FAILED=$(docker compose ps --filter "status=exited" --filter "status=restarting" --format "{{.Name}} ({{.Status}})" 2>/dev/null || true)
            if [ -n "$FAILED" ]; then
              echo "❌ Container bị lỗi / restarting:"
              echo "$FAILED"
              docker compose logs --tail=100
              exit 1
            fi

            # Health check trực tiếp vào AI Core
            echo "Kiểm tra AI Core health..."
            AI_HEALTH_OK=false
            for i in $(seq 1 10); do
              if curl -s -f http://localhost:8001/health > /dev/null 2>&1; then
                AI_HEALTH_OK=true
                echo "✓ AI Core phản hồi HTTP 200 OK"
                break
              fi
              echo "Đang chờ AI Core sẵn sàng (lần $i/10)..."
              sleep 3
            done

            if [ "$AI_HEALTH_OK" = false ]; then
              echo "❌ AI Core không phản hồi /health sau 30s!"
              docker compose logs --tail=100 ai-core
              exit 1
            fi

            echo "✅ Tất cả container và dịch vụ AI Core đang chạy bình thường!"

        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_SYNCHRONIZE: ${{ secrets.DB_SYNCHRONIZE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_JUDGE_PROVIDER: ${{ secrets.EVAL_JUDGE_PROVIDER }}
          EVAL_JUDGE_MODEL: ${{ secrets.EVAL_JUDGE_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          SALES_SEED_PASSWORD: ${{ secrets.SALES_SEED_PASSWORD }}
          SUBSCRIBER_SEED_PASSWORD: ${{ secrets.SUBSCRIBER_SEED_PASSWORD }}
